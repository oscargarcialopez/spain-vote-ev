name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (there is no v10), so the release is pinned
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12" # the floor of requires-python in pyproject.toml
      - name: Install
        run: uv sync --locked
      - name: Check the numbers and the carousels
        run: make check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
