[project]
name = "spain-vote-ev"
version = "0.1.0"
description = "What is one vote worth in Spain's general election of 29 November 2026? Pivot probabilities from a calibrated seat simulation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pypdf>=5.0",
    "typst>=0.15.2",
    "lxml>=6.1.3",
    "pdfplumber>=0.11",
]

[project.scripts]
voteev = "spain_vote_ev.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spain_vote_ev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
